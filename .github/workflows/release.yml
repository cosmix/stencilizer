name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag commit must be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main"
            exit 1
          fi
      - name: Tag must be a release version
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must be vMAJOR.MINOR.PATCH, optionally followed by a PEP 440 suffix (a, b, rc) and a number, for example v1.0.0rc1"
            exit 1
          fi
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.24"
      - name: Lockfile must be current
        run: uv lock --check

  checks:
    needs: verify
    uses: ./.github/workflows/checks.yml

  build:
    needs: checks
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release
          sha256sum -- * > SHA256SUMS
          flags=()
          # PEP 440 pre-releases (a, b, rc) are pre-releases.
          case "$GITHUB_REF_NAME" in
            *[0-9]a[0-9]* | *[0-9]b[0-9]* | *[0-9]rc[0-9]*) flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Stencilizer $GITHUB_REF_NAME" --generate-notes \
            "${flags[@]}" -- *
