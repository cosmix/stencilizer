name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            platform: linux-x86_64
            arch: x86_64
          - os: macos-15
            platform: macos-arm64
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          actual="$(uname -m)"
          if [ "$actual" != "$EXPECTED_ARCH" ]; then
            echo "expected $EXPECTED_ARCH, runner is $actual" >&2
            exit 1
          fi
      # PyInstaller bundles the shared libraries Qt links against, so every one
      # the xcb platform plugin needs must be installed here. xvfb provides the
      # display for the GUI smoke test.
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-util1 libglib2.0-0t64 xvfb
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          version: "0.12.24"
      - run: uv sync --locked --no-dev --group build --extra gui
      - name: Build
        run: packaging/build.sh
      # The frozen GUI runs against the real platform plugin: xcb under xvfb on
      # Linux, cocoa on macOS (hosted runners have a GUI session).
      - name: Smoke test
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a packaging/build.sh --smoke
          else
            packaging/build.sh --smoke
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stencilizer-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
